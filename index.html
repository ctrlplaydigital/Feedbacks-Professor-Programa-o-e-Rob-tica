<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feedback de Professores</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fundo:#f7f8fb;--papel:#fff;--tinta:#3a3b4d;--suave:#6b6d80;--linha:#dfe2ea;--acento:#e8173f;--acento-escuro:#c40f33;--marinho:#2b2a74;--marinho-fundo:#2d2c70;--leve:#1d7a45;--leve-bg:#d8f6dd;--media:#8a5a00;--media-bg:#fef1c4;--erro:#d3122f;--sombra:0 6px 24px rgba(43,42,116,.08);color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--fundo);color:var(--tinta);font:400 15px/1.5 'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif}
.topo{background:#fff;box-shadow:0 2px 14px rgba(43,42,116,.08);border-top:4px solid var(--acento)}
.topo-in{max-width:1000px;margin:0 auto;padding:14px 16px;font-weight:600;color:var(--marinho);display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{display:flex;align-items:center;gap:14px}.topact{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.topo button{padding:8px 16px}.topo button.p{padding:8px 18px}.topo-in{flex-wrap:wrap}
.topo img{display:block;height:32px;width:auto}
main{max-width:1000px;margin:0 auto;padding:32px 16px 72px}
.hero{background:var(--marinho-fundo);color:#fff;border-radius:16px;padding:28px 32px;margin:0 0 24px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-40px;top:-60px;width:260px;height:260px;border-radius:50%;border:36px solid rgba(255,255,255,.05);pointer-events:none}
h1{font-size:1.75rem;font-weight:700;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}.sub{margin:0;color:rgba(255,255,255,.85);font-size:1rem}
h2{font-size:1.125rem;font-weight:600;color:var(--marinho);margin:0 0 14px}
h3{font-size:1.0625rem;font-weight:600;color:var(--marinho);margin:0 0 8px}
section,.card{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:var(--sombra)}
.card{padding:18px 20px;margin:0 0 16px}
.row{display:flex;gap:16px;flex-wrap:wrap}.row>*{flex:1 1 200px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px 14px}
label{display:block;font-size:.8125rem;font-weight:500;color:var(--marinho);margin-bottom:6px}
input,textarea,select{width:100%;font:inherit;color:var(--tinta);background:#fff;border:1px solid var(--linha);border-radius:8px;padding:11px 14px;transition:border-color .15s,box-shadow .15s}
select{width:auto;min-width:160px}
input::placeholder,textarea::placeholder{color:#9a9cad}textarea{min-height:72px;resize:vertical}
input:hover,textarea:hover,select:hover{border-color:#c4c8d6}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid rgba(232,23,63,.25);outline-offset:1px;border-color:var(--acento)}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:8px;border:1px solid var(--marinho);background:#fff;color:var(--marinho);padding:9px 20px;transition:background .15s,border-color .15s}
button:hover{background:#eeeefa}
button.p{background:var(--acento);border-color:var(--acento);color:#fff;padding:12px 28px}button.p:hover{background:var(--acento-escuro);border-color:var(--acento-escuro)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px}.back{margin-bottom:16px}
.tip{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--marinho);color:#fff;font-size:11px;font-weight:700;font-style:normal;line-height:1;margin-left:6px;position:relative;cursor:help;vertical-align:middle}
.tip .tt{display:none;position:absolute;left:-8px;bottom:calc(100% + 8px);width:270px;max-width:72vw;background:var(--marinho-fundo);color:#fff;font-size:.8125rem;font-weight:400;line-height:1.45;padding:10px 12px;border-radius:8px;z-index:10;box-shadow:var(--sombra);text-align:left;white-space:normal}
.tip:hover .tt,.tip:focus .tt{display:block}
.hint,.mu{color:var(--suave);font-size:.8125rem;margin:0 0 10px}main>.mu{margin:0 0 12px}
.act{background:#eeeefa;border-radius:12px;padding:12px 14px;margin-top:10px}
.act label.ck{display:flex;gap:10px;color:var(--tinta);font-size:.9375rem;font-weight:400;align-items:flex-start;cursor:pointer;margin:0}
.act input[type=checkbox]{width:18px;height:18px;margin-top:4px;flex:none;accent-color:var(--acento)}
.tw{overflow-x:auto;width:100%}table{width:100%;border-collapse:collapse}
th{color:var(--marinho);font-weight:600}td,th{padding:8px 10px;border-bottom:1px solid var(--linha);text-align:left;font-size:.875rem;white-space:nowrap}td:nth-child(5){white-space:normal}
.big{font-size:1.75rem;font-weight:700;color:var(--marinho);line-height:1.2}.up{color:var(--leve);font-weight:600}.dn{color:var(--erro);font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:700px}.week div b{display:block;text-align:center;color:var(--marinho)}
.det td{white-space:normal;min-width:90px;vertical-align:top}.grid select{width:100%;min-width:0;text-overflow:ellipsis}
.pill{display:inline-block;padding:2px 11px;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap}.pg{background:#fde2e7;color:#b0102a}.pm{background:var(--media-bg);color:var(--media)}.pl{background:var(--leve-bg);color:var(--leve)}.po{background:#e8e9f1;color:var(--suave)}
tr.tot td{background:#eeeefa;font-weight:600;color:var(--marinho)}.cn{font-weight:600;color:var(--marinho);word-break:break-word}.cl{background:var(--fundo);border:1px solid var(--linha);border-left:4px solid var(--acento);border-radius:8px;padding:6px 8px;margin-top:6px;font-size:.75rem}
.t{cursor:pointer;transition:border-color .15s,transform .15s}.t:hover{border-color:var(--acento);transform:translateY(-1px)}
#ld{position:fixed;inset:0;background:rgba(247,248,251,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:50;font-weight:600;color:var(--marinho)}#ld.on{display:flex}
.sp{width:40px;height:40px;border:4px solid var(--linha);border-top-color:var(--acento);border-radius:50%;animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
#msg{z-index:60;position:fixed;bottom:16px;right:16px;max-width:340px;background:var(--marinho-fundo);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--sombra);display:none}
@media (max-width:600px){.hero{padding:22px 20px}h1{font-size:1.4rem}section{padding:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.sp{animation-duration:2s}}
</style></head><body><header class="topo"><div class="topo-in"><div class="marca"><img src="https://media.cna.com.br/cna_logo_3ff9a4f2fc.svg" alt="CNA" onerror="this.replaceWith(document.createTextNode('CNA'))"><span>Feedback de Professores</span></div><div id="topact" class="topact"></div></div></header><main id="app"></main><div id="ld"><div class="sp"></div><div id="lt"></div></div><div id="msg"></div>
<script>
/* ===== CONFIG: cole aqui a URL do Web App (termina em /exec) ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxPKzCtolgjBV97IomdWRIeLYwIKzmqoUc4UnJGPsfkyP5rfnQd_JcTPdM3hIofKsWC/exec';

/* ===== Camada de API (único ponto que muda ao migrar para o Apps Script) ===== */
function rawCall(action, data) {
  if (window.google && google.script && google.script.run)           // rodando dentro do Apps Script
    return new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => no(e)).api(action, data));
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, data }) }) // GitHub Pages (text/plain evita CORS preflight)
    .then(r => r.json()).then(r => { if (!r.ok) throw new Error(r.error); return r.data; });
}

/* Indicador de carregamento global: aparece em toda chamada ao backend e bloqueia cliques duplicados */
let pend = 0;
const MSG = { teachers: 'Carregando professores…', teacher: 'Carregando professor…', saveFeedback: 'Salvando feedback…', deleteFeedback: 'Excluindo feedback…', addTeacher: 'Adicionando professor…' };
async function call(action, data) {
  pend++; $('#lt').textContent = MSG[action] || 'Carregando…'; $('#ld').classList.add('on');
  try { return await rawCall(action, data); }
  finally { if (--pend <= 0) { pend = 0; $('#ld').classList.remove('on'); } }
}
const nomeTurma = t => `#${t.turmaId} - ${t.modulo} / ${t.mesInicio} / ${String(t.dia).split('-')[0].toUpperCase()} / ${t.horario} / ${t.professor}`;
const nn = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
const clsOf = o => { const c = nn(o.classificacao); return c.startsWith('grav') ? 'graves' : c.startsWith('med') ? 'medias' : 'outras'; };
const prevMes = m => { const [y, n] = m.split('-').map(Number), d = new Date(y, n - 2, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const topo = h => { $('#topact').innerHTML = h; };
const hero = (t, s) => `<div class="hero"><h1>${t}</h1><p class="sub">${s || ''}</p></div>`;
const tip = t => `<span class="tip" tabindex="0" role="img" aria-label="${esc(t)}">i<span class="tt" aria-hidden="true">${esc(t)}</span></span>`;
const lab = (t, d) => `<label>${t}${d ? tip(d) : ''}</label>`;
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MES = m => { const [y, n] = m.split('-'); return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][n - 1] + '/' + y.slice(2); };
const DIAS = ['Seg','Ter','Qua','Qui','Sex','Sáb-AM','Sáb-PM','Sáb','Dom'];
function toast(t) { const m = $('#msg'); m.textContent = t; m.style.display = 'block'; setTimeout(() => m.style.display = 'none', 3500); }
async function run(fn) { try { await fn(); } catch (e) { toast('Erro: ' + (e.message || e)); } }

/* ===== Leitor do HTML da página de turmas ===== */
function parseHTML(html) {
  const d = new DOMParser().parseFromString(html, 'text/html'), out = [];
  const grids = [...d.querySelectorAll('ul')].filter(u => u.querySelector(':scope > ul > li[data-testid="weekdayKlassCell"]'));
  const heads = [...d.querySelectorAll('ul.grid li p')].map(p => p.textContent.trim()).filter(t => /^(Seg|Ter|Qua|Qui|Sex|S[áa]b|Dom)/.test(t)).slice(0, 7);
  grids.forEach(g => [...g.children].forEach((col, i) => col.querySelectorAll('li[data-testid="weekdayKlassCell"]').forEach(li => {
    const nome = (li.querySelector('a p') || {}).textContent || '';
    const m = nome.trim().match(/^#(\d+)\s*-\s*(.+?)\s*\/\s*(\w+)\s*\/\s*([^\/]+?)\s*\/\s*(\d{1,2}:\d{2})\s*\/\s*(.+)$/);
    if (!m) return;
    const q = s => ((li.querySelector(s) || {}).textContent || '').trim();
    out.push({ turmaId: m[1], modulo: m[2], mesInicio: m[3], dia: heads[i] || m[4], horario: m[5], professor: m[6],
      alunos: parseInt(([...li.querySelectorAll('p')].find(p => /^\d+$/.test(p.textContent.trim())) || {}).textContent) || 0, termino: q('[data-testid="endDate"] p:last-child'), aula: q('[data-testid="nextKlass"] p') });
  })));
  return out;
}

/* ===== Gráfico simples em SVG (sem bibliotecas) ===== */
let CG = 0; // contador para dar um id único ao degradê de cada gráfico
function chart(title, vals, labels, bad) {
  if (!vals.length) return '';
  const W = 300, H = 90, mx = Math.max(...vals, 1), mn = Math.min(...vals, 0), r = mx - mn || 1;
  const gid = 'gr' + (++CG), base = H - 15;
  const pts = vals.map((v, i) => [vals.length < 2 ? W / 2 : 26 + i * (W - 52) / (vals.length - 1), H - 15 - (v - mn) / r * (H - 30)]);
  return `<div class="card"><div class="mu">${title}</div><svg viewBox="0 0 ${W} ${H}" width="100%"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2a74" stop-opacity=".38"/><stop offset="1" stop-color="#2b2a74" stop-opacity=".03"/></linearGradient></defs><polygon fill="url(#${gid})" points="${pts[0][0]},${base} ${pts.map(p => p.join(',')).join(' ')} ${pts[pts.length - 1][0]},${base}"/><polyline fill="none" stroke="#2b2a74" stroke-width="2.5" points="${pts.map(p => p.join(',')).join(' ')}"/>
  ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#e8173f"/><text x="${p[0]}" y="${H - 2}" font-size="9" fill="#6b6d80" text-anchor="middle">${labels[i]}</text><text x="${p[0]}" y="${p[1] - 6}" font-size="10" font-weight="600" fill="#3a3b4d" text-anchor="middle">${vals[i]}</text>`).join('')}</svg></div>`;
}
const delta = (a, b, lowGood) => { if (b === undefined) return ''; const d = +(a - b).toFixed(1); if (!d) return '<span class="mu">= igual</span>'; const good = lowGood ? d < 0 : d > 0; return `<span class="${good ? 'up' : 'dn'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}</span>`; };

/* ===== Telas ===== */
async function home() {
  topo('');
  app.innerHTML = hero('Professores', 'Feedback mensal dos professores') + '<p class="hint">Carregando…</p>';
  const ts = await call('teachers');
  topo('<button onclick="run(school)">Visão da escola</button><button class="p" onclick="addForm()">+ Adicionar professor</button>');
  app.innerHTML = `${hero('Professores', 'Feedback mensal dos professores')}
  <div class="row">${ts.map(t => `<div class="card t" onclick="run(()=>teacher('${t.id}'))"><h3>${esc(t.nome)}</h3><span class="mu">${esc(t.email)}</span><div style="margin-top:8px;font-size:13px">${t.ultimoMes ? `Último feedback: <b>${MES(t.ultimoMes)}</b> <span class="mu">(lançado em ${new Date(t.ultimoEm).toLocaleDateString('pt-BR')})</span>` : '<span class="mu">Nenhum feedback lançado</span>'}</div></div>`).join('') || '<div class="card mu" style="text-align:center;padding:30px;flex-basis:100%">Nenhum professor foi cadastrado até o momento.</div>'}</div>`;
}
function addForm() {
  app.innerHTML = `${hero('Adicionar professor', 'Cadastre quem vai receber os feedbacks')}
  <section><h2>Dados do professor</h2>
  <div class="grid"><div>${lab('Nome', 'Escreva exatamente como o nome aparece nas turmas do sistema da escola. É por ele que o sistema liga as turmas ao professor.')}<input id="n" placeholder="Ex.: Gabrielle Siqueira"></div>
  <div>${lab('E-mail', 'Opcional. Serve só para identificar o professor na lista.')}<input id="e" placeholder="professor@escola.com.br"></div></div>
  <p style="margin:20px 0 0"><button class="p" onclick="run(addT)">Adicionar professor</button></p></section>`;
  topo('<button onclick="run(home)">← Cancelar</button>');
  $('#n').focus();
}
async function addT() {
  if (!$('#n').value.trim()) throw new Error('Informe o nome do professor');
  await call('addTeacher', { nome: $('#n').value, email: $('#e').value });
  toast('Professor adicionado'); await home();
}

/* ===== Visão da escola: soma de todos os professores, mês a mês ===== */
let SCH;
async function school() {
  const S = await call('school'), ts = S.teachers.filter(t => t.ativo !== 'não'), ids = new Set(ts.map(t => t.id));
  const fs = S.feedbacks.filter(f => ids.has(f.teacherId)), meses = [...new Set(fs.map(f => f.mes))].sort();
  const nomes = new Set(ts.map(t => nn(t.nome))), ocs = (S.ocorrencias || []).filter(o => nomes.has(nn(o.professor)));
  const agg = meses.map(m => {
    const l = fs.filter(f => f.mes === m), al = l.reduce((s, f) => s + +f.alunos, 0), tu = l.reduce((s, f) => s + +f.turmas, 0);
    const ch = al ? l.reduce((s, f) => s + +f.churn * +f.alunos, 0) / al : l.reduce((s, f) => s + +f.churn, 0) / (l.length || 1); // churn ponderado pelo nº de alunos
    const oo = ocs.filter(o => o.mes === m);
    return { m, n: l.length, tu, al, ch: +ch.toFixed(1), oc: oo.length, gr: oo.filter(o => clsOf(o) === 'graves').length };
  });
  SCH = { ts, fs, agg, ocs, ocErro: S.ocErro };
  const L = agg[agg.length - 1], P = agg[agg.length - 2], pn = S.pontos.filter(p => ids.has(p.teacherId));
  const card = (n, v, d) => `<div class="card"><div class="mu">${n}</div><div class="big">${v}</div>${d}</div>`;
  app.innerHTML = `${hero('Visão da escola', 'Todos os professores somados, mês a mês')}
  ${!L ? '<div class="card mu" style="text-align:center;padding:30px">Ainda não há feedbacks lançados.</div>' : `
  <div class="mu">Mês mais recente: ${MES(L.m)} · ${L.n} de ${ts.length} professores com feedback${P ? ' (comparado a ' + MES(P.m) + ')' : ''}</div>
  <div class="row">${card('Churn médio da escola', L.ch + '%', delta(L.ch, P && P.ch, 1))}${card('Turmas', L.tu, delta(L.tu, P && P.tu))}${card('Alunos', L.al, delta(L.al, P && P.al))}${card('Pontos melhorados', pn.filter(p => p.status === 'melhorado').length + '/' + pn.length, '<span class="mu">' + pn.filter(p => p.status === 'pendente').length + ' pendentes</span>')}</div>
  <div class="row">${chart('Churn médio (%)', agg.map(a => a.ch), agg.map(a => MES(a.m)))}${chart('Turmas', agg.map(a => a.tu), agg.map(a => MES(a.m)))}${chart('Alunos', agg.map(a => a.al), agg.map(a => MES(a.m)))}</div>
  <div class="card"><h3>Escola mês a mês</h3>${S.ocErro ? '<div class="dn" style="font-size:.8125rem;margin-bottom:6px">Ocorrências: ' + esc(S.ocErro) + '</div>' : ''}<div class="hint">Churn = média ponderada pelo número de alunos de cada professor. Se faltar feedback de algum professor no mês, os totais ficam menores que o real (veja a coluna Professores).</div>
  <div class="tw"><table><tr><th>Mês</th><th>Professores</th><th>Churn médio</th><th>Turmas</th><th>Alunos</th><th>Ocorrências</th></tr>${[...agg].reverse().map((a, i, x) => { const p = x[i + 1]; return `<tr><td>${MES(a.m)}</td><td class="${a.n < ts.length ? 'dn' : ''}">${a.n}/${ts.length}</td><td>${a.ch}% ${delta(a.ch, p && p.ch, 1)}</td><td>${a.tu} ${delta(a.tu, p && p.tu)}</td><td>${a.al} ${delta(a.al, p && p.al)}</td><td>${a.oc} <span class="mu">(${a.gr} graves)</span></td></tr>`; }).join('')}</table></div></div>
  <div class="card"><h3>Detalhe por professor</h3><select id="sm" onchange="schoolMes(this.value)">${[...meses].reverse().map(m => `<option value="${m}">${MES(m)}</option>`).join('')}</select><div id="bd"></div></div>`}${ocSchool()}`;
  topo('<button onclick="run(home)">← Professores</button>');
  if (L) schoolMes(L.m);
}
const ocTxt = (m, nm) => { const k = SCH.ocs.filter(o => o.mes === m && nn(o.professor) === nn(nm)); return k.length + ' <span class="mu">(' + k.filter(o => clsOf(o) === 'graves').length + ' graves)</span>'; };
function schoolMes(m) {
  const l = SCH.fs.filter(f => f.mes === m), sem = SCH.ts.filter(t => !l.some(f => f.teacherId === t.id));
  $('#bd').innerHTML = `<div class="tw"><table><tr><th>Professor</th><th>Churn</th><th>Turmas</th><th>Alunos</th><th>Ocorrências</th></tr>${l.map(f => `<tr><td>${esc((SCH.ts.find(t => t.id === f.teacherId) || {}).nome)}</td><td>${f.churn}%</td><td>${f.turmas}</td><td>${f.alunos}</td><td>${ocTxt(m, (SCH.ts.find(t => t.id === f.teacherId) || {}).nome)}</td></tr>`).join('')}</table></div>${sem.length ? `<p class="dn">Sem feedback neste mês: ${sem.map(t => esc(t.nome)).join(', ')}</p>` : ''}`;
}

let D;
async function teacher(id) {
  D = await call('teacher', { id });
  topo('<button onclick="run(home)">← Professores</button><button class="p" onclick="novoFeedback()">Novo feedback do mês</button>'); const fs = D.feedbacks, L = fs[fs.length - 1], P = fs[fs.length - 2];
  const tur = D.turmas.filter(t => L && t.feedbackId === L.id), pend = D.pontos.filter(p => p.status === 'pendente'), ok = D.pontos.filter(p => p.status === 'melhorado');
  const card = (n, k, lg) => `<div class="card"><div class="mu">${n}</div><div class="big">${L ? L[k] + (k === 'churn' ? '%' : '') : '–'}</div>${L ? delta(+L[k], P && +P[k], lg) : ''}</div>`;
  app.innerHTML = `${hero(esc(D.teacher.nome), esc(D.teacher.email) || 'Professor')}
  
  ${L ? `<div class="mu">Último feedback: ${MES(L.mes)} (comparado a ${P ? MES(P.mes) : 'nenhum mês anterior'})</div>` : '<div class="mu">Sem feedbacks ainda.</div>'}
  <div class="row">${card('Churn','churn',1)}${card('Turmas','turmas')}${card('Alunos','alunos')}<div class="card"><div class="mu">Pontos melhorados</div><div class="big">${ok.length}/${D.pontos.length}</div><span class="mu">${pend.length} pendentes</span></div></div>
  <div class="row">${chart('Churn (%)', fs.map(f => +f.churn), fs.map(f => MES(f.mes)))}${chart('Turmas', fs.map(f => +f.turmas), fs.map(f => MES(f.mes)))}${chart('Alunos', fs.map(f => +f.alunos), fs.map(f => MES(f.mes)))}</div>
  ${tur.length ? `<div class="card"><h3>Semana (${MES(L.mes)})</h3><div style="overflow-x:auto"><div class="week">${DIAS.slice(0, 7).map(d => `<div><b>${d}</b>${tur.filter(t => t.dia === d).sort((a, b) => a.horario < b.horario ? -1 : 1).map(t => `<div class="cl"><span class="cn">${esc(nomeTurma(t))}</span><br>${t.alunos} alunos</div>`).join('')}</div>`).join('')}</div></div>
  <p><button onclick="$('#tt').hidden=!$('#tt').hidden" style="margin-bottom:10px">Mostrar/ocultar tabela de turmas</button></p>
  <div class="tw"><table id="tt" hidden><tr><th>Turma</th><th>Dia</th><th>Hora</th><th>Alunos</th><th>Término</th><th>Aula</th></tr>${tur.map(t => `<tr><td>${esc(nomeTurma(t))}</td><td>${t.dia}</td><td>${t.horario}</td><td>${t.alunos}</td><td>${t.termino}</td><td>${esc(t.aula)}</td></tr>`).join('')}</table></div></div>` : ''}
  <div class="card"><h3>Histórico mês a mês</h3><div class="tw"><table><tr><th>Mês</th><th>Churn</th><th>Turmas</th><th>Alunos</th><th>Observações</th><th></th></tr>${[...fs].reverse().map((f, i, a) => { const p = a[i + 1]; return `<tr><td>${MES(f.mes)}</td><td>${f.churn}% ${delta(+f.churn, p && +p.churn, 1)}</td><td>${f.turmas} ${delta(+f.turmas, p && +p.turmas)}</td><td>${f.alunos} ${delta(+f.alunos, p && +p.alunos)}</td><td>${esc(f.obs)}</td><td><button class="g" onclick="run(()=>delF('${f.id}','${MES(f.mes)}'))">Excluir</button></td></tr>`; }).join('')}</table></div></div>
  <div class="card"><h3>Pontos de melhoria</h3>${D.pontos.map(p => `<div>${p.status === 'melhorado' ? '✅' : '⏳'} ${esc(p.texto)} <span class="mu">(desde ${MES(p.mesCriado)}${p.mesResolvido ? ' · resolvido em ' + MES(p.mesResolvido) : ''})</span></div>`).join('') || '<span class="mu">Nenhum ponto.</span>'}</div>
  ${ocBlock()}`;
}

async function delF(id, m) {
  if (!confirm('Excluir o feedback de ' + m + '? Turmas e pontos criados nesse mês também serão removidos.')) return;
  await call('deleteFeedback', { id }); toast('Feedback excluído'); teacher(D.teacher.id);
}
const pill = c => { const x = nn(c), k = x.startsWith('grav') ? 'pg' : x.startsWith('med') ? 'pm' : x.startsWith('lev') ? 'pl' : 'po'; return `<span class="pill ${k}">${esc(c)}</span>`; };
const cnt = (l, k) => l.filter(o => !k || clsOf(o) === k).length;
const totRow = (nome, l) => `<tr class="tot"><td>${nome}</td><td>${cnt(l, 'graves')}</td><td>${cnt(l, 'medias')}</td><td>${cnt(l, 'outras')}</td><td>${l.length}</td></tr>`;
const ocHead = n => `<tr><th>${n}</th><th>Graves</th><th>Médias</th><th>Outras</th><th>Total</th></tr>`;
/* Tabela de detalhes com filtros dinâmicos (usada na ficha do professor e na visão da escola) */
let OCL = {};
function ocDetail(id, list, comProf) {
  OCL[id] = { list, comProf };
  const uniq = k => [...new Set(list.map(o => o[k]).filter(Boolean))].sort();
  const sel = (k, n) => `<div>${lab(n)}<select data-k="${k}" onchange="ocF('${id}')"><option value="">Todos</option>${uniq(k).map(v => `<option>${esc(v)}</option>`).join('')}</select></div>`;
  setTimeout(() => ocF(id), 0);
  return `<div class="grid" id="${id}f"><div>${lab('Data de')}<input type="date" data-k="de" onchange="ocF('${id}')"></div><div>${lab('Data até')}<input type="date" data-k="ate" onchange="ocF('${id}')"></div>
  ${comProf ? sel('professor', 'Professor') : ''}${sel('turma', 'Turma')}${sel('tipo', 'Tipo')}${sel('assunto', 'Assunto')}${sel('motivo', 'Motivo')}${sel('classificacao', 'Classificação')}
  <div>${lab('Descrição contém')}<input type="search" data-k="q" placeholder="Buscar no texto" oninput="ocF('${id}')"></div></div>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 0 8px"><span class="hint" id="${id}c" style="margin:0"></span><button type="button" style="padding:6px 14px" onclick="ocClear('${id}')">Limpar filtros</button></div><div class="tw det"><table id="${id}t"></table></div>`;
}
function ocClear(id) { document.querySelectorAll('#' + id + 'f [data-k]').forEach(e => e.value = ''); ocF(id); }
function ocF(id) {
  const el = $('#' + id + 't'); if (!el) return;
  const { list, comProf } = OCL[id], f = {};
  document.querySelectorAll('#' + id + 'f [data-k]').forEach(e => f[e.dataset.k] = e.value.trim());
  const L = list.filter(o => (!f.de || o.data >= f.de) && (!f.ate || o.data <= f.ate) && ['professor', 'turma', 'tipo', 'assunto', 'motivo', 'classificacao'].every(k => !f[k] || o[k] === f[k]) && (!f.q || nn(o.descricao).includes(nn(f.q))));
  $('#' + id + 'c').textContent = L.length + ' de ' + list.length + ' ocorrências';
  el.innerHTML = `<tr><th>Data</th>${comProf ? '<th>Professor</th>' : ''}<th>Turma</th><th>Tipo</th><th>Assunto</th><th>Motivo</th><th>Classificação</th><th>Descrição</th></tr>` +
    (L.map(o => `<tr><td>${o.data.split('-').reverse().join('/')}</td>${comProf ? `<td>${esc(o.professor)}</td>` : ''}<td>${esc(o.turma)}</td><td>${esc(o.tipo)}</td><td>${esc(o.assunto)}</td><td>${esc(o.motivo)}</td><td>${pill(o.classificacao)}</td><td>${esc(o.descricao)}</td></tr>`).join('') || '<tr><td colspan="9" class="mu">Nenhuma ocorrência com esses filtros.</td></tr>');
}
function ocBlock() {
  const vazio = t => `<div class="card"><h3>Ocorrências</h3><span class="mu">${esc(t)}</span></div>`, oc = D.ocorrencias || [];
  if (D.ocErro) return vazio(D.ocErro);
  if (!oc.length) return vazio('Nenhuma ocorrência registrada para este professor.');
  const meses = [...new Set(oc.map(o => o.mes))].sort(), U = meses[meses.length - 1], A = prevMes(U);
  const c = (m, k) => oc.filter(o => o.mes === m && (!k || clsOf(o) === k)).length;
  const card = (n, k) => `<div class="card"><div class="mu">${n}</div><div class="big">${c(U, k)}</div>${delta(c(U, k), c(A, k), 1)}</div>`;
  return `<div class="card"><h3>Ocorrências</h3><div class="mu">Mês mais recente com ocorrências: ${MES(U)} (comparado a ${MES(A)})</div>
  <div class="row">${card('Total', '')}${card('Graves', 'graves')}${card('Médias', 'medias')}${card('Outras', 'outras')}</div></div>
  <div class="row" style="align-items:flex-start"><div class="card" style="flex:2 1 420px"><h3>Ocorrências mês a mês</h3><div class="tw"><table>${ocHead('Mês')}${[...meses].reverse().map(m => `<tr><td>${MES(m)}</td><td>${c(m, 'graves')}</td><td>${c(m, 'medias')}</td><td>${c(m, 'outras')}</td><td><b>${c(m)}</b></td></tr>`).join('')}${totRow('Todos os meses', oc)}</table></div></div>
  <div style="flex:1 1 240px;max-width:340px">${chart('Ocorrências por mês', meses.map(m => c(m)), meses.map(MES))}</div></div>
  <div class="card"><h3>Detalhes das ocorrências</h3>${ocDetail('ocp', oc, false)}</div>`;
}
/* Ocorrências na visão da escola */
function ocSchool() {
  const oc = SCH.ocs;
  if (SCH.ocErro) return `<div class="card"><h3>Ocorrências da escola</h3><span class="mu">${esc(SCH.ocErro)}</span></div>`;
  if (!oc.length) return `<div class="card"><h3>Ocorrências da escola</h3><span class="mu">Nenhuma ocorrência registrada para os professores cadastrados.</span></div>`;
  const meses = [...new Set(oc.map(o => o.mes))].sort(), profs = [...new Set(oc.map(o => o.professor))].sort();
  return `<div class="row" style="align-items:flex-start"><div class="card" style="flex:1 1 320px"><h3>Ocorrências da escola mês a mês</h3><div class="tw"><table>${ocHead('Mês')}${[...meses].reverse().map(m => { const l = oc.filter(o => o.mes === m); return `<tr><td>${MES(m)}</td><td>${cnt(l, 'graves')}</td><td>${cnt(l, 'medias')}</td><td>${cnt(l, 'outras')}</td><td><b>${l.length}</b></td></tr>`; }).join('')}${totRow('Todos os meses', oc)}</table></div></div>
  <div class="card" style="flex:1 1 320px"><h3>Ocorrências por professor</h3><div class="tw"><table>${ocHead('Professor')}${profs.map(p => { const l = oc.filter(o => o.professor === p); return `<tr><td>${esc(p)}</td><td>${cnt(l, 'graves')}</td><td>${cnt(l, 'medias')}</td><td>${cnt(l, 'outras')}</td><td><b>${l.length}</b></td></tr>`; }).join('')}${totRow('Todos os professores', oc)}</table></div></div>
  <div style="flex:1 1 240px;max-width:340px">${chart('Ocorrências da escola por mês', meses.map(m => oc.filter(o => o.mes === m).length), meses.map(MES))}</div></div>
  <div class="card"><h3>Detalhes das ocorrências da escola</h3>${ocDetail('ocs', oc, true)}</div>`;
}
let TUR = [];
function novoFeedback() {
  const pend = D.pontos.filter(p => p.status === 'pendente'), now = new Date().toISOString().slice(0, 7); TUR = [];
  app.innerHTML = `${hero('Novo feedback', esc(D.teacher.nome))}
  <section><h2>1. Dados do mês</h2><p class="hint">Escolha o mês do feedback e informe o churn do professor.</p>
  <div class="grid"><div>${lab('Mês', 'Mês a que este feedback se refere. Se já existir um feedback deste mês, ele será substituído, e o sistema pede confirmação antes.')}<input id="mes" type="month" value="${now}"></div>
  <div>${lab('Churn (%)', 'Percentual de evasão dos alunos deste professor. Pode digitar com vírgula ou ponto, por exemplo 4,4.')}<input id="ch" inputmode="decimal" placeholder="ex.: 4,4 ou 4.4"></div></div></section>
  <section><h2>2. Turmas</h2><p class="hint">Cole o HTML da página de turmas já filtrada pelo professor. Turmas, alunos e módulos são lidos sozinhos.</p>
  ${lab('HTML da página de turmas', 'No sistema da escola, abra a lista de turmas filtrada por este professor, clique com o botão direito, escolha Inspecionar, copie o elemento body e cole aqui. Só entram turmas cujo professor tem o mesmo nome do cadastro.')}
  <textarea id="html" rows="5" oninput="prev()" placeholder="Cole aqui o HTML da página"></textarea><p id="pv" class="hint" style="margin:10px 0 0"></p></section>
  <section><h2>3. Pontos de melhoria</h2><p class="hint">Marque o que melhorou desde o último feedback e registre os novos pontos.</p>
  ${pend.length ? lab('Pontos do último feedback', 'Marque os pontos que o professor melhorou. Os que ficarem sem marca continuam como pendentes no próximo mês.') : ''}
  ${pend.map(p => `<div class="act"><label class="ck"><input type="checkbox" class="mel" value="${p.id}"><span>Melhorou: ${esc(p.texto)} <span class="mu">(${MES(p.mesCriado)})</span></span></label></div>`).join('') || '<p class="hint">Nenhum ponto pendente.</p>'}
  <div style="height:14px"></div>${lab('Novos pontos a melhorar', 'Escreva um ponto por campo. Use o botão abaixo, ou Enter, para criar mais campos.')}<div id="nv"></div>
  <p style="margin:12px 0 0"><button type="button" onclick="addPonto()">+ Adicionar ponto</button></p></section>
  <section><h2>4. Observações</h2>${lab('Observações do mês', 'Anotações livres sobre este feedback. Aparecem no histórico do professor.')}<textarea id="ob" rows="3" placeholder="Opcional"></textarea></section>
  <button class="p" onclick="run(save)">Salvar feedback</button>`;
  topo(`<button onclick="run(()=>teacher('${D.teacher.id}'))">← Cancelar</button>`);
  addPonto(false);
}
function addPonto(foco) {
  const d = document.createElement('div'); d.style.cssText = 'display:flex;gap:8px;margin-top:8px';
  d.innerHTML = '<input class="nv" placeholder="Ex.: comunicar melhor com os alunos"><button type="button" title="Remover" onclick="this.parentNode.remove()">✕</button>';
  const i = d.firstChild; i.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); addPonto(); } };
  $('#nv').appendChild(d); if (foco !== false) i.focus();
}
function prev() {
  TUR = parseHTML($('#html').value).filter(t => t.professor.toLowerCase() === D.teacher.nome.toLowerCase());
  const all = parseHTML($('#html').value).length;
  $('#pv').innerHTML = TUR.length ? `<b class="up">${TUR.length} turmas · ${TUR.reduce((s, t) => s + t.alunos, 0)} alunos</b> (professor confere)${all > TUR.length ? ` — ${all - TUR.length} turmas de outros professores ignoradas` : ''}` : `<span class="dn">Nenhuma turma encontrada para "${esc(D.teacher.nome)}".</span>`;
}
async function save() {
  const ch = parseFloat($('#ch').value.trim().replace(',', '.'));
  if (!$('#mes').value || isNaN(ch) || ch < 0) throw new Error('Preencha o mês e um churn válido (ex.: 4,4)');
  if (!TUR.length) throw new Error('Cole o HTML com as turmas do professor');
  const ja = D.feedbacks.find(f => f.mes === $('#mes').value);
  if (ja && !confirm('Você já tem um feedback de ' + MES(ja.mes) + ' para este professor.\n\nSe salvar, ele será substituído por este novo (turmas, churn, observações e pontos criados naquele mês).\n\nTem certeza?')) return;
  await call('saveFeedback', { teacherId: D.teacher.id, mes: $('#mes').value, churn: ch, obs: $('#ob').value, turmas: TUR,
    melhorados: [...document.querySelectorAll('.mel:checked')].map(c => c.value), novos: [...document.querySelectorAll('.nv')].map(i => i.value.trim()).filter(Boolean) });
  toast('Feedback salvo'); teacher(D.teacher.id);
}
run(home);
</script></body></html>
