<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feedback de Professores</title>
<style>
:root{--bg:#0e1420;--card:#172033;--line:#27344d;--tx:#e8edf7;--mu:#8fa0bd;--ac:#5aa9ff;--ok:#34d399;--bad:#fb7185}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:1100px;margin:auto;padding:20px}h1,h2,h3{margin:.2em 0}.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:200px}
button{background:var(--ac);color:#06121f;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--line)}
input,textarea{width:100%;background:#0b1120;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
label{display:block;margin:8px 0 3px;color:var(--mu);font-size:13px}table{width:100%;border-collapse:collapse}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.big{font-size:28px;font-weight:700}.up{color:var(--ok)}.dn{color:var(--bad)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;overflow-x:auto;min-width:700px}
.week div b{display:block;text-align:center;color:var(--ac)}.cl{background:#0b1120;border:1px solid var(--line);border-radius:6px;padding:5px;margin-top:5px;font-size:12px}
.t{cursor:pointer}.t:hover{border-color:var(--ac)}#ld{position:fixed;inset:0;background:rgba(6,10,18,.72);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:9;font-weight:600}#ld.on{display:flex}.sp{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}#msg{z-index:10;position:fixed;bottom:16px;right:16px;background:#000;padding:10px 14px;border-radius:8px;display:none}
</style></head><body><main id="app"></main><div id="ld"><div class="sp"></div><div id="lt"></div></div><div id="msg"></div>
<script>
/* ===== CONFIG: cole aqui a URL do Web App (termina em /exec) ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxIFJT_HAOXxikHGYuJY0f4rW2fZhyHbM-LwkoqkAiw3c7exh6DVY4Ka5j4GiazQoCv/exec';

/* ===== Camada de API (único ponto que muda ao migrar para o Apps Script) ===== */
function rawCall(action, data) {
  if (window.google && google.script && google.script.run)           // rodando dentro do Apps Script
    return new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => no(e)).api(action, data));
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, data }) }) // GitHub Pages (text/plain evita CORS preflight)
    .then(r => r.json()).then(r => { if (!r.ok) throw new Error(r.error); return r.data; });
}

/* Indicador de carregamento global: aparece em toda chamada ao backend e bloqueia cliques duplicados */
let pend = 0;
const MSG = { teachers: 'Carregando professores…', teacher: 'Carregando professor…', saveFeedback: 'Salvando feedback…', deleteFeedback: 'Excluindo feedback…', addTeacher: 'Adicionando professor…' };
async function call(action, data) {
  pend++; $('#lt').textContent = MSG[action] || 'Carregando…'; $('#ld').classList.add('on');
  try { return await rawCall(action, data); }
  finally { if (--pend <= 0) { pend = 0; $('#ld').classList.remove('on'); } }
}
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MES = m => { const [y, n] = m.split('-'); return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][n - 1] + '/' + y.slice(2); };
const DIAS = ['Seg','Ter','Qua','Qui','Sex','Sáb-AM','Sáb-PM','Sáb','Dom'];
function toast(t) { const m = $('#msg'); m.textContent = t; m.style.display = 'block'; setTimeout(() => m.style.display = 'none', 3500); }
async function run(fn) { try { await fn(); } catch (e) { toast('Erro: ' + (e.message || e)); } }

/* ===== Leitor do HTML da página de turmas ===== */
function parseHTML(html) {
  const d = new DOMParser().parseFromString(html, 'text/html'), out = [];
  const grids = [...d.querySelectorAll('ul')].filter(u => u.querySelector(':scope > ul > li[data-testid="weekdayKlassCell"]'));
  const heads = [...d.querySelectorAll('ul.grid li p')].map(p => p.textContent.trim()).filter(t => /^(Seg|Ter|Qua|Qui|Sex|S[áa]b|Dom)/.test(t)).slice(0, 7);
  grids.forEach(g => [...g.children].forEach((col, i) => col.querySelectorAll('li[data-testid="weekdayKlassCell"]').forEach(li => {
    const nome = (li.querySelector('a p') || {}).textContent || '';
    const m = nome.trim().match(/^#(\d+)\s*-\s*(.+?)\s*\/\s*(\w+)\s*\/\s*([^\/]+?)\s*\/\s*(\d{1,2}:\d{2})\s*\/\s*(.+)$/);
    if (!m) return;
    const q = s => ((li.querySelector(s) || {}).textContent || '').trim();
    out.push({ turmaId: m[1], modulo: m[2], mesInicio: m[3], dia: heads[i] || m[4], horario: m[5], professor: m[6],
      alunos: parseInt(([...li.querySelectorAll('p')].find(p => /^\d+$/.test(p.textContent.trim())) || {}).textContent) || 0, termino: q('[data-testid="endDate"] p:last-child'), aula: q('[data-testid="nextKlass"] p') });
  })));
  return out;
}

/* ===== Gráfico simples em SVG (sem bibliotecas) ===== */
function chart(title, vals, labels, bad) {
  if (!vals.length) return '';
  const W = 300, H = 90, mx = Math.max(...vals, 1), mn = Math.min(...vals, 0), r = mx - mn || 1;
  const pts = vals.map((v, i) => [vals.length < 2 ? W / 2 : 10 + i * (W - 20) / (vals.length - 1), H - 15 - (v - mn) / r * (H - 30)]);
  return `<div class="card"><div class="mu">${title}</div><svg viewBox="0 0 ${W} ${H}" width="100%"><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${pts.map(p => p.join(',')).join(' ')}"/>
  ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--ac)"/><text x="${p[0]}" y="${H - 2}" font-size="9" fill="#8fa0bd" text-anchor="middle">${labels[i]}</text><text x="${p[0]}" y="${p[1] - 6}" font-size="10" fill="#e8edf7" text-anchor="middle">${vals[i]}</text>`).join('')}</svg></div>`;
}
const delta = (a, b, lowGood) => { if (b === undefined) return ''; const d = +(a - b).toFixed(1); if (!d) return '<span class="mu">= igual</span>'; const good = lowGood ? d < 0 : d > 0; return `<span class="${good ? 'up' : 'dn'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}</span>`; };

/* ===== Telas ===== */
async function home() {
  app.innerHTML = '<h1>Professores</h1><p class="mu">Carregando…</p>';
  const ts = await call('teachers');
  app.innerHTML = `<h1>Professores</h1><div class="row">${ts.map(t => `<div class="card t" onclick="run(()=>teacher('${t.id}'))"><h3>${esc(t.nome)}</h3><span class="mu">${esc(t.email)}</span></div>`).join('') || '<p class="mu">Nenhum professor cadastrado ainda.</p>'}</div>
  <div class="card"><h3>Adicionar professor</h3><label>Nome (igual ao que aparece nas turmas)</label><input id="n"><label>E-mail</label><input id="e"><p><button onclick="run(addT)">Adicionar professor</button></p></div>`;
}
async function addT() { await call('addTeacher', { nome: $('#n').value, email: $('#e').value }); toast('Professor adicionado'); home(); }

let D;
async function teacher(id) {
  D = await call('teacher', { id }); const fs = D.feedbacks, L = fs[fs.length - 1], P = fs[fs.length - 2];
  const tur = D.turmas.filter(t => L && t.feedbackId === L.id), pend = D.pontos.filter(p => p.status === 'pendente'), ok = D.pontos.filter(p => p.status === 'melhorado');
  const card = (n, k, lg) => `<div class="card"><div class="mu">${n}</div><div class="big">${L ? L[k] + (k === 'churn' ? '%' : '') : '–'}</div>${L ? delta(+L[k], P && +P[k], lg) : ''}</div>`;
  app.innerHTML = `<button class="g" onclick="run(home)">← Professores</button><h1>${esc(D.teacher.nome)}</h1>
  <p><button onclick="novoFeedback()">Novo feedback do mês</button></p>
  ${L ? `<div class="mu">Último feedback: ${MES(L.mes)} (comparado a ${P ? MES(P.mes) : 'nenhum mês anterior'})</div>` : '<p class="mu">Sem feedbacks ainda.</p>'}
  <div class="row">${card('Churn','churn',1)}${card('Turmas','turmas')}${card('Alunos','alunos')}<div class="card"><div class="mu">Pontos melhorados</div><div class="big">${ok.length}/${D.pontos.length}</div><span class="mu">${pend.length} pendentes</span></div></div>
  <div class="row">${chart('Churn (%)', fs.map(f => +f.churn), fs.map(f => MES(f.mes)))}${chart('Turmas', fs.map(f => +f.turmas), fs.map(f => MES(f.mes)))}${chart('Alunos', fs.map(f => +f.alunos), fs.map(f => MES(f.mes)))}</div>
  ${tur.length ? `<div class="card"><h3>Semana (${MES(L.mes)})</h3><div style="overflow-x:auto"><div class="week">${DIAS.slice(0, 7).map(d => `<div><b>${d}</b>${tur.filter(t => t.dia === d).sort((a, b) => a.horario < b.horario ? -1 : 1).map(t => `<div class="cl"><b>${t.horario}</b> ${esc(t.modulo)}<br>${t.alunos} alunos</div>`).join('')}</div>`).join('')}</div></div>
  <p><button class="g" onclick="$('#tt').hidden=!$('#tt').hidden">Mostrar/ocultar tabela de turmas</button></p>
  <table id="tt" hidden><tr><th>Turma</th><th>Módulo</th><th>Dia</th><th>Hora</th><th>Alunos</th><th>Término</th><th>Aula</th></tr>${tur.map(t => `<tr><td>#${t.turmaId}</td><td>${esc(t.modulo)}</td><td>${t.dia}</td><td>${t.horario}</td><td>${t.alunos}</td><td>${t.termino}</td><td>${esc(t.aula)}</td></tr>`).join('')}</table></div>` : ''}
  <div class="card"><h3>Histórico mês a mês</h3><table><tr><th>Mês</th><th>Churn</th><th>Turmas</th><th>Alunos</th><th>Observações</th><th></th></tr>${[...fs].reverse().map((f, i, a) => { const p = a[i + 1]; return `<tr><td>${MES(f.mes)}</td><td>${f.churn}% ${delta(+f.churn, p && +p.churn, 1)}</td><td>${f.turmas} ${delta(+f.turmas, p && +p.turmas)}</td><td>${f.alunos} ${delta(+f.alunos, p && +p.alunos)}</td><td>${esc(f.obs)}</td><td><button class="g" onclick="run(()=>delF('${f.id}','${MES(f.mes)}'))">Excluir</button></td></tr>`; }).join('')}</table></div>
  <div class="card"><h3>Pontos de melhoria</h3>${D.pontos.map(p => `<div>${p.status === 'melhorado' ? '✅' : '⏳'} ${esc(p.texto)} <span class="mu">(desde ${MES(p.mesCriado)}${p.mesResolvido ? ' · resolvido em ' + MES(p.mesResolvido) : ''})</span></div>`).join('') || '<span class="mu">Nenhum ponto.</span>'}</div>
  <div class="card"><h3>Ocorrências</h3><span class="mu">Em breve: virá da planilha de ocorrências (graves, médias…).</span></div>`;
}

async function delF(id, m) {
  if (!confirm('Excluir o feedback de ' + m + '? Turmas e pontos criados nesse mês também serão removidos.')) return;
  await call('deleteFeedback', { id }); toast('Feedback excluído'); teacher(D.teacher.id);
}
let TUR = [];
function novoFeedback() {
  const pend = D.pontos.filter(p => p.status === 'pendente'), now = new Date().toISOString().slice(0, 7); TUR = [];
  app.innerHTML = `<button class="g" onclick="run(()=>teacher('${D.teacher.id}'))">← Cancelar</button><h1>Novo feedback · ${esc(D.teacher.nome)}</h1>
  <div class="card"><div class="row"><div><label>Mês</label><input id="mes" type="month" value="${now}"></div><div><label>Churn (%)</label><input id="ch" inputmode="decimal" placeholder="ex.: 4,4 ou 4.4"></div></div>
  <label>Cole o HTML da página de turmas (já filtrada pelo professor)</label><textarea id="html" rows="5" oninput="prev()"></textarea><div id="pv" class="mu"></div></div>
  <div class="card"><h3>Pontos do último feedback</h3>${pend.map(p => `<label style="color:var(--tx)"><input type="checkbox" class="mel" value="${p.id}" style="width:auto"> Melhorou: ${esc(p.texto)} <span class="mu">(${MES(p.mesCriado)})</span></label>`).join('') || '<span class="mu">Nenhum ponto pendente.</span>'}
  <label>Novos pontos a melhorar (um por linha)</label><textarea id="nv" rows="3"></textarea><label>Observações</label><textarea id="ob" rows="2"></textarea></div>
  <button onclick="run(save)">Salvar feedback</button>`;
}
function prev() {
  TUR = parseHTML($('#html').value).filter(t => t.professor.toLowerCase() === D.teacher.nome.toLowerCase());
  const all = parseHTML($('#html').value).length;
  $('#pv').innerHTML = TUR.length ? `<b class="up">${TUR.length} turmas · ${TUR.reduce((s, t) => s + t.alunos, 0)} alunos</b> (professor confere)${all > TUR.length ? ` — ${all - TUR.length} turmas de outros professores ignoradas` : ''}` : `<span class="dn">Nenhuma turma encontrada para "${esc(D.teacher.nome)}".</span>`;
}
async function save() {
  const ch = parseFloat($('#ch').value.trim().replace(',', '.'));
  if (!$('#mes').value || isNaN(ch) || ch < 0) throw new Error('Preencha o mês e um churn válido (ex.: 4,4)');
  if (!TUR.length) throw new Error('Cole o HTML com as turmas do professor');
  const ja = D.feedbacks.find(f => f.mes === $('#mes').value);
  if (ja && !confirm('Você já tem um feedback de ' + MES(ja.mes) + ' para este professor.\n\nSe salvar, ele será substituído por este novo (turmas, churn, observações e pontos criados naquele mês).\n\nTem certeza?')) return;
  await call('saveFeedback', { teacherId: D.teacher.id, mes: $('#mes').value, churn: ch, obs: $('#ob').value, turmas: TUR,
    melhorados: [...document.querySelectorAll('.mel:checked')].map(c => c.value), novos: $('#nv').value.split('\n').map(s => s.trim()) });
  toast('Feedback salvo'); teacher(D.teacher.id);
}
run(home);
</script></body></html>
