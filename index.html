<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feedback de Professores</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fundo:#f7f8fb;--papel:#fff;--tinta:#3a3b4d;--suave:#6b6d80;--linha:#dfe2ea;--acento:#e8173f;--acento-escuro:#c40f33;--marinho:#2b2a74;--marinho-fundo:#2d2c70;--leve:#1d7a45;--leve-bg:#d8f6dd;--media:#8a5a00;--media-bg:#fef1c4;--erro:#d3122f;--sombra:0 6px 24px rgba(43,42,116,.08);color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--fundo);color:var(--tinta);font:400 15px/1.5 'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif}
.topo{background:#fff;box-shadow:0 2px 14px rgba(43,42,116,.08);border-top:4px solid var(--acento)}
.topo-in{max-width:1000px;margin:0 auto;padding:14px 16px;font-weight:600;color:var(--marinho);display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{display:flex;align-items:center;gap:14px}.topact{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.topo button{padding:8px 16px}.topo button.p{padding:8px 18px}.topo-in{flex-wrap:wrap}
.topo img{display:block;height:32px;width:auto}
main{max-width:1000px;margin:0 auto;padding:32px 16px 72px}
.hero{background:var(--marinho-fundo);color:#fff;border-radius:16px;padding:28px 32px;margin:0 0 24px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-40px;top:-60px;width:260px;height:260px;border-radius:50%;border:36px solid rgba(255,255,255,.05);pointer-events:none}
h1{font-size:1.75rem;font-weight:700;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}.sub{margin:0;color:rgba(255,255,255,.85);font-size:1rem}
h2{font-size:1.125rem;font-weight:600;color:var(--marinho);margin:0 0 14px}
h3{font-size:1.0625rem;font-weight:600;color:var(--marinho);margin:0 0 8px}
section,.card{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:var(--sombra)}
.card{padding:18px 20px;margin:0 0 16px}
.row{display:flex;gap:16px;flex-wrap:wrap}.row>*{flex:1 1 200px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px 14px}
label{display:block;font-size:.8125rem;font-weight:500;color:var(--marinho);margin-bottom:6px}
input,textarea,select{width:100%;font:inherit;color:var(--tinta);background:#fff;border:1px solid var(--linha);border-radius:8px;padding:11px 14px;transition:border-color .15s,box-shadow .15s}
select{width:auto;min-width:160px}
input::placeholder,textarea::placeholder{color:#9a9cad}textarea{min-height:72px;resize:vertical}
input:hover,textarea:hover,select:hover{border-color:#c4c8d6}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid rgba(232,23,63,.25);outline-offset:1px;border-color:var(--acento)}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:8px;border:1px solid var(--marinho);background:#fff;color:var(--marinho);padding:9px 20px;transition:background .15s,border-color .15s}
button:hover{background:#eeeefa}
button.p{background:var(--acento);border-color:var(--acento);color:#fff;padding:12px 28px}button.p:hover{background:var(--acento-escuro);border-color:var(--acento-escuro)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px}.back{margin-bottom:16px}
.tip{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--marinho);color:#fff;font-size:11px;font-weight:700;font-style:normal;line-height:1;margin-left:6px;position:relative;cursor:help;vertical-align:middle}
.tip .tt{display:none;position:absolute;left:-8px;bottom:calc(100% + 8px);width:270px;max-width:72vw;background:var(--marinho-fundo);color:#fff;font-size:.8125rem;font-weight:400;line-height:1.45;padding:10px 12px;border-radius:8px;z-index:10;box-shadow:var(--sombra);text-align:left;white-space:normal}
.tip:hover .tt,.tip:focus .tt{display:block}
.hint,.mu{color:var(--suave);font-size:.8125rem;margin:0 0 10px}main>.mu{margin:0 0 12px}
.act{background:#eeeefa;border-radius:12px;padding:12px 14px;margin-top:10px}
.act label.ck{display:flex;gap:10px;color:var(--tinta);font-size:.9375rem;font-weight:400;align-items:flex-start;cursor:pointer;margin:0}
.act input[type=checkbox]{width:18px;height:18px;margin-top:4px;flex:none;accent-color:var(--acento)}
.tw{overflow-x:auto;width:100%}table{width:100%;border-collapse:collapse}
th{color:var(--marinho);font-weight:600}td,th{padding:8px 10px;border-bottom:1px solid var(--linha);text-align:left;font-size:.875rem;white-space:nowrap}td:nth-child(5){white-space:normal}
.big{font-size:1.75rem;font-weight:700;color:var(--marinho);line-height:1.2}.up{color:var(--leve);font-weight:600}.dn{color:var(--erro);font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:700px}.week div b{display:block;text-align:center;color:var(--marinho)}
.det td{white-space:nowrap;vertical-align:middle}.cut{display:block;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cut.dc{max-width:240px}
#md{position:fixed;inset:0;background:rgba(43,42,116,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:55}.mbox{background:#fff;border-radius:16px;padding:24px;max-width:640px;width:100%;max-height:85vh;overflow:auto;box-shadow:var(--sombra)}.grid select{width:100%;min-width:0;text-overflow:ellipsis}
button:disabled{opacity:.45;cursor:default}button:disabled:hover{background:#fff}.lk{cursor:pointer}.lk:hover td{background:#f4f5fb}.ic{padding:6px 9px;line-height:0}.ic svg{width:18px;height:18px}button.dg{border-color:var(--erro);color:var(--erro)}button.dg:hover{background:#fde2e7}
.g3,.g2{display:grid;gap:16px;margin-bottom:16px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g3>.card,.g2>.card{margin:0}
@media (max-width:700px){.g3,.g2{grid-template-columns:1fr}}
.cmp th,.cmp td{white-space:normal}.cmp th{vertical-align:bottom}
.pill{display:inline-block;padding:2px 11px;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap}.pg{background:#fde2e7;color:#b0102a}.pm{background:var(--media-bg);color:var(--media)}.pl{background:var(--leve-bg);color:var(--leve)}.po{background:#e8e9f1;color:var(--suave)}
tr.tot td{background:#eeeefa;font-weight:600;color:var(--marinho)}.cn{font-weight:600;color:var(--marinho);word-break:break-word}.cl{background:var(--fundo);border:1px solid var(--linha);border-left:4px solid var(--acento);border-radius:8px;padding:6px 8px;margin-top:6px;font-size:.75rem}
.t{cursor:pointer;transition:border-color .15s,transform .15s}.t:hover{border-color:var(--acento);transform:translateY(-1px)}
#ld{position:fixed;inset:0;background:rgba(247,248,251,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:50;font-weight:600;color:var(--marinho)}#ld.on{display:flex}
.sp{width:40px;height:40px;border:4px solid var(--linha);border-top-color:var(--acento);border-radius:50%;animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
#msg{z-index:60;position:fixed;bottom:16px;right:16px;max-width:340px;background:var(--marinho-fundo);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--sombra);display:none}
@media (max-width:600px){.hero{padding:22px 20px}h1{font-size:1.4rem}section{padding:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.sp{animation-duration:2s}}
</style></head><body><header class="topo"><div class="topo-in"><div class="marca"><img src="https://media.cna.com.br/cna_logo_3ff9a4f2fc.svg" alt="CNA" onerror="this.replaceWith(document.createTextNode('CNA'))"></div><div id="topact" class="topact"></div></div></header><main id="app"></main><div id="ld"><div class="sp"></div><div id="lt"></div></div><div id="msg"></div><div id="md" hidden onclick="if(event.target===this)ocFechar()"><div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mdt"><button class="ic" onclick="ocFechar()" aria-label="Fechar" style="float:right">✕</button><div id="mdc"></div></div></div>
<script>
/* ===== CONFIG: cole aqui a URL do Web App (termina em /exec) ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwanLkiSRRIZp_M_aMA7yUrmjIE7-0m7w46a7840BPPMHn21CzZmhHbp8exgWqdRzM/exec';

/* ===== Camada de API (único ponto que muda ao migrar para o Apps Script) ===== */
function rawCall(action, data) {
  const token = sessionStorage.getItem('tk') || '';
  if (window.google && google.script && google.script.run)           // rodando dentro do Apps Script
    return new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => no(e)).api(action, data, token));
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, data, token }) }) // GitHub Pages (text/plain evita CORS preflight)
    .then(r => r.json()).then(r => { if (!r.ok) throw new Error(r.error); return r.data; });
}

/* Indicador de carregamento global: aparece em toda chamada ao backend e bloqueia cliques duplicados */
let pend = 0;
const MSG = { teachers: 'Carregando professores…', teacher: 'Carregando professor…', saveFeedback: 'Salvando feedback…', deleteFeedback: 'Excluindo feedback…', addTeacher: 'Adicionando professor…', loginAdmin: 'Entrando…', enviarRelatorio: 'Enviando e-mail…', enviarCredenciais: 'Enviando credenciais…', esqueciSenha: 'Enviando e-mail…', trocarSenha: 'Salvando nova senha…', loginProfessor: 'Entrando…', gerarAcesso: 'Gerando acesso…', updatePonto: 'Salvando ponto…', deletePonto: 'Excluindo ponto…', savePesquisa: 'Salvando pesquisa…', deletePesquisa: 'Excluindo pesquisa…', updateTeacher: 'Salvando alterações…', deleteTeacher: 'Excluindo professor…' };
async function call(action, data) {
  pend++; $('#lt').textContent = MSG[action] || 'Carregando…'; $('#ld').classList.add('on');
  try { return await rawCall(action, data); }
  catch (e) { if (String(e.message || e) === 'SESSAO') { sair('Sessão expirada. Entre novamente.'); throw new Error('Sessão expirada'); } throw e; }
  finally { if (--pend <= 0) { pend = 0; $('#ld').classList.remove('on'); } }
}
const nomeTurma = t => `#${t.turmaId} - ${t.modulo} / ${t.mesInicio} / ${String(t.dia).split('-')[0].toUpperCase()} / ${t.horario} / ${t.professor}`;
const nn = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
const clsOf = o => { const c = nn(o.classificacao); return c.startsWith('grav') ? 'graves' : c.startsWith('med') ? 'medias' : 'leves'; };
const prevMes = m => { const [y, n] = m.split('-').map(Number), d = new Date(y, n - 2, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const topo = h => { $('#topact').innerHTML = h + (sessionStorage.getItem('tk') ? (RO ? '<button onclick="trocarSenhaTela()">Trocar senha</button>' : '') + '<button onclick="sair()">Sair</button>' : ''); };
/* Churn = cancelamentos do mês ÷ alunos do mês anterior (feedbacks antigos, sem cancelamentos, usam o churn que foi digitado) */
const fmt1 = n => +n.toFixed(1), vazio = c => c === '' || c === undefined || c === null;
const pct = v => v == null ? '—' : v + '%', dlt = (a, b, lg) => a == null || b == null ? '' : delta(a, b, lg);
function churnOf(fs, f) {
  if (vazio(f.cancelamentos)) return vazio(f.churn) ? null : +f.churn;
  const b = fs.find(x => x.mes === prevMes(f.mes));
  return b && +b.alunos > 0 ? fmt1(+f.cancelamentos / +b.alunos * 100) : null;
}
const hero = (t, s) => `<div class="hero"><h1>${t}</h1><p class="sub">${s || ''}</p></div>`;
const tip = t => `<span class="tip" tabindex="0" role="img" aria-label="${esc(t)}">i<span class="tt" aria-hidden="true">${esc(t)}</span></span>`;
const lab = (t, d) => `<label>${t}${d ? tip(d) : ''}</label>`;
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MES = m => { const [y, n] = m.split('-'); return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][n - 1] + '/' + y.slice(2); };
const DIAS = ['Seg','Ter','Qua','Qui','Sex','Sáb-AM','Sáb-PM','Sáb','Dom'];
function toast(t) { const m = $('#msg'); m.textContent = t; m.style.display = 'block'; setTimeout(() => m.style.display = 'none', 3500); }
async function run(fn) { try { await fn(); } catch (e) { toast('Erro: ' + (e.message || e)); } }

/* ===== Leitor do HTML da página de turmas ===== */
function parseHTML(html) {
  const d = new DOMParser().parseFromString(html, 'text/html'), out = [];
  const grids = [...d.querySelectorAll('ul')].filter(u => u.querySelector(':scope > ul > li[data-testid="weekdayKlassCell"]'));
  const heads = [...d.querySelectorAll('ul.grid li p')].map(p => p.textContent.trim()).filter(t => /^(Seg|Ter|Qua|Qui|Sex|S[áa]b|Dom)/.test(t)).slice(0, 7);
  grids.forEach(g => [...g.children].forEach((col, i) => col.querySelectorAll('li[data-testid="weekdayKlassCell"]').forEach(li => {
    const nome = (li.querySelector('a p') || {}).textContent || '';
    const m = nome.trim().match(/^#(\d+)\s*-\s*(.+?)\s*\/\s*(\w+)\s*\/\s*([^\/]+?)\s*\/\s*(\d{1,2}:\d{2})\s*\/\s*(.+)$/);
    if (!m) return;
    const q = s => ((li.querySelector(s) || {}).textContent || '').trim();
    out.push({ turmaId: m[1], modulo: m[2], mesInicio: m[3], dia: heads[i] || m[4], horario: m[5], professor: m[6],
      alunos: parseInt(([...li.querySelectorAll('p')].find(p => /^\d+$/.test(p.textContent.trim())) || {}).textContent) || 0, termino: q('[data-testid="endDate"] p:last-child'), aula: q('[data-testid="nextKlass"] p') });
  })));
  return out;
}

/* ===== Gráfico simples em SVG (sem bibliotecas) ===== */
let CG = 0; // contador para dar um id único ao degradê de cada gráfico
function chart(title, vals, labels, bad, W = 300, H = 90) {
  if (!vals.length) return '';
  const mx = Math.max(...vals, 1), mn = Math.min(...vals, 0), r = mx - mn || 1;
  const gid = 'gr' + (++CG), base = H - 15;
  const pts = vals.map((v, i) => [vals.length < 2 ? W / 2 : 26 + i * (W - 52) / (vals.length - 1), H - 15 - (v - mn) / r * (H - 30)]);
  return `<div class="card"><div class="mu">${title}</div><svg viewBox="0 0 ${W} ${H}" width="100%"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2a74" stop-opacity=".38"/><stop offset="1" stop-color="#2b2a74" stop-opacity=".03"/></linearGradient></defs><polygon fill="url(#${gid})" points="${pts[0][0]},${base} ${pts.map(p => p.join(',')).join(' ')} ${pts[pts.length - 1][0]},${base}"/><polyline fill="none" stroke="#2b2a74" stroke-width="2.5" points="${pts.map(p => p.join(',')).join(' ')}"/>
  ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#e8173f"/><text x="${p[0]}" y="${H - 2}" font-size="9" fill="#6b6d80" text-anchor="middle">${labels[i]}</text><text x="${p[0]}" y="${p[1] - 6}" font-size="10" font-weight="600" fill="#3a3b4d" text-anchor="middle">${vals[i]}</text>`).join('')}</svg></div>`;
}
const delta = (a, b, lowGood, dec = 1) => { if (b === undefined) return ''; const d = +(a - b).toFixed(dec); if (!d) return '<span class="mu">= igual</span>'; const good = lowGood ? d < 0 : d > 0; return `<span class="${good ? 'up' : 'dn'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}</span>`; };

/* ===== Telas ===== */
async function home() {
  topo('');
  app.innerHTML = hero('Professores', 'Feedback mensal dos professores') + '<p class="hint">Carregando…</p>';
  const ts = await call('teachers');
  topo('<button onclick="run(school)">Visão da escola</button><button class="p" onclick="addForm()">+ Adicionar professor</button>');
  TS = ts;
  const lapis = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  app.innerHTML = `${hero('Professores', 'Feedback mensal dos professores')}
  ${ts.length ? `<section style="padding:8px 16px"><div class="tw"><table><tr><th>Professor</th><th>E-mail</th><th>Último feedback</th><th></th></tr>${ts.map(t => `<tr class="lk" onclick="run(()=>teacher('${t.id}'))"><td><b style="color:var(--marinho)">${esc(t.nome)}</b></td><td>${esc(t.email) || '<span class="mu">—</span>'}</td><td>${t.ultimoMes ? `<b>${MES(t.ultimoMes)}</b> <span class="mu">(lançado em ${new Date(t.ultimoEm).toLocaleDateString('pt-BR')})</span>` : '<span class="mu">Nenhum feedback lançado</span>'}</td><td style="text-align:right"><button onclick="event.stopPropagation();run(()=>teacher('${t.id}'))">Feedbacks</button> <button class="ic" title="Editar professor" aria-label="Editar ${esc(t.nome)}" onclick="event.stopPropagation();editForm('${t.id}')">${lapis}</button></td></tr>`).join('')}</table></div></section>`
  : '<div class="card mu" style="text-align:center;padding:30px">Nenhum professor foi cadastrado até o momento.</div>'}`;
}
let TS = [];
function editForm(id) {
  const t = TS.find(x => x.id === id);
  app.innerHTML = `${hero('Editar professor', esc(t.nome))}
  <section><h2>Dados do professor</h2>
  <div class="grid"><div>${lab('Nome', 'Se mudar o nome, ele precisa continuar igual ao que aparece nas turmas do sistema da escola e na planilha de ocorrências, senão as turmas e ocorrências deixam de ser ligadas a este professor.')}<input id="n" value="${esc(t.nome)}"></div>
  <div>${lab('E-mail')}<input id="e" value="${esc(t.email)}"></div></div>
  <div class="acts" style="margin:20px 0 0;justify-content:space-between"><button class="p" onclick="run(()=>saveT('${id}'))">Salvar alterações</button><button class="dg" onclick="run(()=>delT('${id}'))">Excluir professor</button></div></section>${acessoSec(t)}`;
  topo('<button onclick="run(home)">← Cancelar</button>');
}
const linkProf = c => location.origin + location.pathname + '?p=' + c;
function acessoSec(t) {
  return `<section><h2>Acesso do professor</h2><p class="hint">O professor entra pelo link, com o usuário e a senha. Ele vê só a própria ficha, sem poder editar nada.</p>
  ${t.temAcesso ? `${lab('Link de acesso')}<div style="display:flex;gap:8px;flex-wrap:wrap"><input id="lk" readonly value="${esc(linkProf(t.codigo))}" style="flex:1 1 300px"><button type="button" onclick="copiar('lk')">Copiar link</button></div><div style="height:14px"></div>` : ''}
  ${lab('Usuário de acesso', 'Usuário que o professor digita para entrar. Por padrão é o e-mail, mas você pode trocar por outro.')}
  <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="us" value="${esc(t.usuario || t.email || '')}" style="flex:1 1 300px" autocomplete="off">${t.temAcesso ? `<button type="button" onclick="run(()=>saveUsuario('${t.id}'))">Salvar usuário</button>` : ''}</div>
  <p class="hint" style="margin:12px 0">Situação: <b>${t.temAcesso ? 'acesso criado' : 'sem acesso criado'}</b></p>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" onclick="run(()=>gerarAcesso('${t.id}'))">${t.temAcesso ? 'Gerar nova senha' : 'Criar acesso'}</button>${t.email ? `<button type="button" onclick="run(()=>enviarCredenciais('${t.id}'))">Enviar credenciais por e-mail</button>` : ''}</div>
  <p class="hint" style="margin:10px 0 0">${t.email ? 'Enviar credenciais gera uma nova senha e manda usuário, senha e link para ' + esc(t.email) + '.' : 'Cadastre o e-mail do professor para poder enviar as credenciais por e-mail.'}</p><div id="acs"></div></section>`;
}
const acessoBox = r => `<div class="act"><b>Anote agora: a senha não poderá ser vista de novo.</b><div style="margin-top:8px">Usuário: <b>${esc(r.usuario)}</b></div><div style="display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap">Senha: <input id="sn" readonly value="${esc(r.senha)}" style="max-width:200px"><button type="button" onclick="copiar('sn')">Copiar</button></div></div>`;
async function gerarAcesso(id) {
  const t = TS.find(x => x.id === id), usu = $('#us').value.trim();
  if (!usu) throw new Error('Informe o usuário de acesso');
  if (t.temAcesso && !confirm('Gerar uma nova senha? A senha atual deixa de funcionar.')) return;
  const r = await call('gerarAcesso', { id, usuario: usu }); t.codigo = r.codigo; t.temAcesso = true; t.usuario = r.usuario; editForm(id);
  $('#acs').innerHTML = acessoBox(r);
}
async function enviarCredenciais(id) {
  const t = TS.find(x => x.id === id), usu = $('#us').value.trim();
  if (!usu) throw new Error('Informe o usuário de acesso');
  if (!confirm('Gerar uma NOVA senha e enviar as credenciais para ' + t.email + '? A senha atual deixa de funcionar.')) return;
  const r = await call('enviarCredenciais', { id, usuario: usu, siteUrl: location.origin + location.pathname });

/* ===== Visão da escola: soma de todos os professores, mês a mês ===== */
let SCH;

  const nomes = new Set(ts.map(t => nn(t.nome))), ocs = (S.ocorrencias || []).filter(o => nomes.has(nn(o.professor)));
  const agg = meses.map(m => {

    let num = 0, den = 0; // churn da escola = soma dos cancelamentos ÷ soma dos alunos do mês anterior (professores com feedback nos dois meses)
    l.forEach(f => { if (vazio(f.cancelamentos)) return; const b = fs.find(x => x.teacherId === f.teacherId && x.mes === prevMes(m)); if (b && +b.alunos > 0) { num += +f.cancelamentos; den += +b.alunos; } });
    let ch = den ? fmt1(num / den * 100) : null;
    if (ch === null) { const lg = l.filter(f => vazio(f.cancelamentos) && !vazio(f.churn)), a2 = lg.reduce((s, f) => s + +f.alunos, 0); if (lg.length) ch = fmt1(a2 ? lg.reduce((s, f) => s + +f.churn * +f.alunos, 0) / a2 : lg.reduce((s, f) => s + +f.churn, 0) / lg.length); } // meses antigos, sem cancelamentos
    const oo = ocs.filter(o => o.mes === m);

  });
  SCH = { ts, fs, agg, ocs, ocErro: S.ocErro, pesq: (S.pesquisas || []).sort((a, b) => (+a.ano - +b.ano) || (+a.semestre - +b.semestre)) };
  const L = agg[agg.length - 1], P = agg[agg.length - 2], pn = S.pontos.filter(p => ids.has(p.teacherId));
  const card = (n, v, d) => `<div class="card"><div class="mu">${n}</div><div class="big">${v}</div>${d}</div>`;

  <div class="mu">Mês mais recente: ${MES(L.m)} · ${L.n} de ${ts.length} professores com feedback${P ? ' (comparado a ' + MES(P.m) + ')' : ''}</div>
  <div class="row">${card('Churn da escola', pct(L.ch), dlt(L.ch, P && P.ch, 1))}${card('Turmas', L.tu, delta(L.tu, P && P.tu))}${card('Alunos', L.al, delta(L.al, P && P.al))}${card('Pontos melhorados', pn.filter(p => p.status === 'melhorado').length + '/' + pn.length, '<span class="mu">' + pn.filter(p => p.status === 'pendente').length + ' pendentes</span>')}</div>
  <div class="row">${chart('Churn da escola (%)', agg.filter(a => a.ch != null).map(a => a.ch), agg.filter(a => a.ch != null).map(a => MES(a.m)))}${chart('Turmas', agg.map(a => a.tu), agg.map(a => MES(a.m)))}${chart('Alunos', agg.map(a => a.al), agg.map(a => MES(a.m)))}</div>
  <div class="card"><h3>Escola mês a mês</h3>${S.ocErro ? '<div class="dn" style="font-size:.8125rem;margin-bottom:6px">Ocorrências: ' + esc(S.ocErro) + '</div>' : ''}<div class="hint">Churn = cancelamentos do mês ÷ alunos do mês anterior, somando os professores que têm feedback nos dois meses. Se faltar feedback de algum professor no mês, os totais ficam menores que o real (veja a coluna Professores).</div>

/* Tabela de detalhes com filtros dinâmicos (usada na ficha do professor e na visão da escola) */

function ocBlock() {

  <section><h2>1. Dados do mês</h2><p class="hint">Escolha o mês do feedback e informe o churn do professor.</p>
  <div class="grid"><div>${lab('Mês', F ? 'O mês não pode ser alterado ao editar. Para mudar o mês, exclua este feedback e crie outro.' : 'Mês a que este feedback se refere. Se já existir um feedback deste mês, ele será substituído, e o sistema pede confirmação antes.')}<input id="mes" type="month" value="${now}" oninput="chPrev()" ${F ? 'disabled' : ''}></div>
  <div>${lab('Cancelamentos no mês', 'Quantos alunos deste professor cancelaram neste mês. O churn é calculado sozinho: cancelamentos ÷ alunos do mês anterior.')}<input id="ca" type="number" min="0" step="1" placeholder="ex.: 2" value="${F && !vazio(F.cancelamentos) ? F.cancelamentos : ''}" oninput="chPrev()"></div></div>
  <p id="chv" class="hint" style="margin:12px 0 0"></p></section>
  <section><h2>2. Turmas</h2><p class="hint">${F ? 'As turmas já salvas neste feedback são mantidas. Cole um novo HTML só se quiser substituí-las.' : 'Cole o HTML da página de turmas já filtrada pelo professor. Turmas, alunos e módulos são lidos sozinhos.'}</p>
  ${lab('HTML da página de turmas', 'No sistema da escola, abra a lista de turmas filtrada por este professor, clique com o botão direito, escolha Inspecionar, copie o elemento body e cole aqui. Só entram turmas cujo professor tem o mesmo nome do cadastro.')}
  <textarea id="html" rows="5" oninput="prev()" placeholder="Cole aqui o HTML da página"></textarea><p id="pv" class="hint" style="margin:10px 0 0"></p></section>
  <section><h2>3. Pontos de melhoria</h2><p class="hint">Marque o que melhorou desde o último feedback e registre os novos pontos.</p>
  ${pend.length ? lab('Pontos do último feedback', 'Marque os pontos que o professor melhorou. Os que ficarem sem marca continuam como pendentes no próximo mês.') : ''}
  ${pend.map(p => `<div class="act"><label class="ck"><input type="checkbox" class="mel" value="${p.id}" ${p.status === 'melhorado' ? 'checked' : ''}><span>Melhorou: ${esc(p.texto)} <span class="mu">(${MES(p.mesCriado)})</span></span></label></div>`).join('') || '<p class="hint">Nenhum ponto pendente.</p>'}
  <div style="height:14px"></div>${lab('Novos pontos a melhorar', 'Escreva um ponto por campo. Use o botão abaixo, ou Enter, para criar mais campos.')}<div id="nv"></div>
  <p style="margin:12px 0 0"><button type="button" onclick="addPonto()">+ Adicionar ponto</button></p></section>
  <section><h2>4. Pesquisa de satisfação</h2><p class="hint">Semestral. Marque só quando houver uma pesquisa nova (ou para corrigir uma anterior). O mês deste feedback não importa: o que vale é o ano e o semestre.</p>
  <div class="act"><label class="ck"><input type="checkbox" id="pq_on" onchange="$('#pqb').hidden=!this.checked"><span>Registrar uma pesquisa de satisfação neste feedback</span></label></div>
  <div id="pqb" hidden style="margin-top:16px"><div id="pqf">${pesqFields()}</div></div>
  ${D.pesquisas.length ? `<h3 style="margin:20px 0 8px">Pesquisas anteriores</h3><div class="tw cmp"><table><tr>${pqHead}<th></th></tr>${[...D.pesquisas].reverse().map(p => `<tr><td><b>${pLab(p)}</b></td>${PQ.map(([k]) => `<td>${pNum(p, k)}</td>`).join('')}<td style="text-align:right"><button type="button" class="ic" title="Editar esta pesquisa" aria-label="Editar pesquisa" onclick="pesqLoad('${p.id}')">${ICO.ed}</button></td></tr>`).join('')}</table></div>` : ''}</section>
  <section><h2>5. Observações</h2>${lab('Observações do mês', 'Anotações livres sobre este feedback. Aparecem no histórico do professor.')}<textarea id="ob" rows="3" placeholder="Opcional">${F ? esc(F.obs) : ''}</textarea></section>
  <button class="p" onclick="run(save)">${F ? 'Salvar alterações' : 'Salvar feedback'}</button>`;
  topo(`<button onclick="run(()=>teacher('${D.teacher.id}'))">← Cancelar</button>`);
  addPonto(false); chPrev(); pvInit();
}
function pvInit() { if (EDIT && $('#pv')) $('#pv').innerHTML = `<b class="up">${TUR.length} turmas · ${TUR.reduce((s, t) => s + t.alunos, 0)} alunos</b> (já salvas neste feedback)`; }
function chPrev() {
  const m = $('#mes').value, ca = $('#ca').value, el = $('#chv'); if (!el || !m) return;
  const pm = prevMes(m), b = D.feedbacks.find(f => f.mes === pm);
  el.innerHTML = !b || !(+b.alunos > 0) ? `<span class="dn">Não há feedback de ${MES(pm)} (com alunos) para este professor, então o churn deste mês não poderá ser calculado.</span>`
    : ca === '' ? `Base de cálculo: <b>${b.alunos} alunos</b> em ${MES(pm)}.`
    : `Churn calculado: <b>${fmt1(+ca / +b.alunos * 100)}%</b> (${ca} cancelamentos ÷ ${b.alunos} alunos em ${MES(pm)})`;
}
function addPonto(foco) {
  const d = document.createElement('div'); d.style.cssText = 'display:flex;gap:8px;margin-top:8px';
  d.innerHTML = '<input class="nv" placeholder="Ex.: comunicar melhor com os alunos"><button type="button" title="Remover" onclick="this.parentNode.remove()">✕</button>';
  const i = d.firstChild; i.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); addPonto(); } };
  $('#nv').appendChild(d); if (foco !== false) i.focus();
}
function prev() {
  if (EDIT && !$('#html').value.trim()) { TUR = EDIT.turmas; pvInit(); return; } // campo vazio na edição = mantém as turmas salvas
  TUR = parseHTML($('#html').value).filter(t => t.professor.toLowerCase() === D.teacher.nome.toLowerCase());
  const all = parseHTML($('#html').value).length;
  $('#pv').innerHTML = TUR.length ? `<b class="up">${TUR.length} turmas · ${TUR.reduce((s, t) => s + t.alunos, 0)} alunos</b> (professor confere)${all > TUR.length ? ` — ${all - TUR.length} turmas de outros professores ignoradas` : ''}` : `<span class="dn">Nenhuma turma encontrada para "${esc(D.teacher.nome)}".</span>`;
}
async function save() {
  const ca = parseInt($('#ca').value, 10);
  if (!$('#mes').value || isNaN(ca) || ca < 0) throw new Error('Preencha o mês e os cancelamentos (use 0 se não houve)');
  if (!TUR.length) throw new Error('Cole o HTML com as turmas do professor');
  const pesquisa = $('#pq_on').checked ? readPesq(D.pesquisas) : null;
  if ($('#pq_on').checked && !pesquisa) return;
  const ja = EDIT ? null : D.feedbacks.find(f => f.mes === $('#mes').value);
  if (ja && !confirm('Você já tem um feedback de ' + MES(ja.mes) + ' para este professor.\n\nSe salvar, ele será substituído por este novo (turmas, cancelamentos e observações). Os pontos de melhoria já lançados neste mês são mantidos, e os novos serão somados a eles.\n\nTem certeza?')) return;
  await call('saveFeedback', { teacherId: D.teacher.id, mes: $('#mes').value, editId: EDIT ? EDIT.id : undefined, pesquisa, cancelamentos: ca, obs: $('#ob').value, turmas: TUR,
    melhorados: [...document.querySelectorAll('.mel:checked')].map(c => c.value), novos: [...document.querySelectorAll('.nv')].map(i => i.value.trim()).filter(Boolean) });
  toast('Feedback salvo'); teacher(D.teacher.id);
}
/* ===== Login e inicialização ===== */
let RO = false; // true = professor (somente leitura)
const PARAM_P = new URLSearchParams(location.search).get('p'); // código do link do professor
function sair(msg) {
  if (sessionStorage.getItem('tk') && typeof msg !== 'string') rawCall('logout').catch(() => {});
  sessionStorage.clear(); RO = false; loginTela(typeof msg === 'string' ? msg : '');
}
function loginTela(msg, ok) {
  topo('');
  app.innerHTML = `<div style="max-width:420px;margin:0 auto">${hero(PARAM_P ? 'Acesso do professor' : 'Acesso administrativo', PARAM_P ? 'Entre com o usuário e a senha que você recebeu.' : 'Entre para acessar o painel de feedbacks.')}
  <section>${msg ? `<p class="${ok ? 'up' : 'dn'}" style="margin:0 0 12px">${esc(msg)}</p>` : ''}
  ${lab('Usuário')}<input id="lu" autocomplete="username">
  <div style="height:14px"></div>${lab('Senha')}<input id="ls" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')run(entrar)">
  <p style="margin:20px 0 0"><button class="p" onclick="run(entrar)">Entrar</button></p>
  ${PARAM_P ? '<p style="margin:14px 0 0"><button type="button" style="border:none;background:none;text-decoration:underline;padding:4px 0" onclick="esqueciTela()">Esqueci minha senha</button></p>' : ''}</section></div>`;
  $('#lu').focus(); $('#lu').onkeydown = e => { if (e.key === 'Enter') $('#ls').focus(); };
}
function esqueciTela() {
  app.innerHTML = `<div style="max-width:420px;margin:0 auto">${hero('Esqueci minha senha', 'Informe o usuário ou o e-mail do seu cadastro. Enviaremos o usuário e uma nova senha para o e-mail cadastrado.')}
  <section>${lab('Usuário ou e-mail')}<input id="ei" autocomplete="username" onkeydown="if(event.key==='Enter')run(esqueciEnviar)">
  <p style="margin:20px 0 0;display:flex;gap:10px;flex-wrap:wrap"><button class="p" onclick="run(esqueciEnviar)">Enviar nova senha</button><button onclick="loginTela()">Voltar ao login</button></p></section></div>`;
  $('#ei').focus();
}
async function esqueciEnviar() {
  const v = $('#ei').value.trim(); if (!v) throw new Error('Informe o usuário ou o e-mail');
  const r = await call('esqueciSenha', { codigo: PARAM_P, ident: v });
  loginTela(r.msg, true); // volta ao login com o aviso em verde
}
/* Troca de senha do professor (janela) */
function trocarSenhaTela() {
  $('#mdc').innerHTML = `<h3 id="mdt" style="margin:0 44px 12px 0">Trocar senha</h3>
  ${lab('Senha atual')}<input id="ts_a" type="password" autocomplete="current-password">
  <div style="height:12px"></div>${lab('Nova senha', 'Mínimo de 8 caracteres.')}<input id="ts_n" type="password" autocomplete="new-password">
  <div style="height:12px"></div>${lab('Repita a nova senha')}<input id="ts_c" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')run(salvarSenha)">
  <p style="margin:20px 0 0;display:flex;gap:10px;flex-wrap:wrap"><button class="p" onclick="run(salvarSenha)">Salvar nova senha</button><button onclick="ocFechar()">Cancelar</button></p>`;
  $('#md').hidden = false; $('#ts_a').focus();
}
async function salvarSenha() {
  const a = $('#ts_a').value, n = $('#ts_n').value, c = $('#ts_c').value;
  if (!a || !n) throw new Error('Preencha a senha atual e a nova senha');
  if (n.length < 8) throw new Error('A nova senha precisa ter pelo menos 8 caracteres');
  if (n !== c) throw new Error('A confirmação não confere com a nova senha');
  await call('trocarSenha', { atual: a, nova: n });
  ocFechar(); toast('Senha alterada com sucesso');
}
async function entrar() {
  const u = $('#lu').value.trim(), s = $('#ls').value;
  if (!u || !s) throw new Error('Preencha o usuário e a senha');
  const r = PARAM_P ? await call('loginProfessor', { codigo: PARAM_P, usuario: u, senha: s }) : await call('loginAdmin', { usuario: u, senha: s, siteUrl: location.origin + location.pathname });
  sessionStorage.setItem('tk', r.token); sessionStorage.setItem('role', r.role); sessionStorage.setItem('tid', r.tid || '');
  await entrarApp();
}
async function entrarApp() {
  RO = sessionStorage.getItem('role') === 'prof';
  if (RO) await teacher(sessionStorage.getItem('tid')); else await home();
}
async function boot() {
  if (sessionStorage.getItem('tk') && (!PARAM_P || sessionStorage.getItem('role') === 'prof')) {
    try { await call('me'); await entrarApp(); return; } catch (e) { sessionStorage.clear(); }
  }
  if (!$('#lu')) loginTela(); // se a sessão expirada já mostrou a tela de login com aviso, não a refaz
}
run(boot);

</script></body></html>
